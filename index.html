<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>打麻雀計錢表 & 龍虎榜</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #2e7d32;
            --text: #333333;
            --win: #2e7d32;   /* 正數/贏錢：綠色 */
            --loss: #d32f2f;  /* 負數/輸錢：紅色 */
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        h2 {
            margin-top: 0;
            color: var(--primary);
            text-align: center;
            font-size: 1.2em;
        }
        .input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 10px;
        }
        .input-group select {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            background-color: #fff;
        }
        .input-group input {
            width: 110px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-align: right;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:active { opacity: 0.9; }
        .btn-add-player {
            background-color: #007bff;
            padding: 8px 12px;
            width: auto;
            margin-top: 0;
            font-size: 14px;
            white-space: nowrap;
        }
        .btn-share {
            background-color: #17a2b8;
            margin-top: 10px;
        }
        .btn-clear-all {
            background-color: #d32f2f;
            margin-top: 15px;
            font-size: 14px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.95em;
        }
        th, td {
            padding: 10px 5px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }
        th { background-color: #f8f9fa; }
        .win-score { color: var(--win); font-weight: bold; }
        .loss-score { color: var(--loss); font-weight: bold; }
        .error { color: var(--loss); text-align: center; font-size: 0.9em; display: none; margin-top: 5px; }
        
        .history-item {
            border-bottom: 1px solid #eee;
            padding: 10px 0;
            font-size: 0.85em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 10px;
            flex-grow: 1;
        }
        .btn-del {
            background: none;
            border: none;
            color: #999;
            font-size: 1.1em;
            cursor: pointer;
            padding: 5px 8px;
            width: auto;
            margin: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 新增玩家 -->
    <div class="card">
        <h2>👥 新增雀友</h2>
        <div style="display: flex; gap: 8px;">
            <input type="text" id="new-player-name" placeholder="輸入玩家名字" style="flex:1; padding:8px; border:1px solid #ccc; border-radius:6px; font-size:16px;">
            <button class="btn-add-player" onclick="addNewPlayer()">新增</button>
        </div>
    </div>

    <!-- 每局輸贏輸入 -->
    <div class="card">
        <h2>🀄 輸入今局對局</h2>
        <p style="font-size: 0.8em; color: #666; text-align: center; margin-bottom: 15px;">贏錢填正數（如 50），輸錢填負數（如 -50）<br>4 人總和必須等於 0</p>
        
        <div class="input-group">
            <select id="select0"></select>
            <input type="number" id="score0" placeholder="0">
        </div>
        <div class="input-group">
            <select id="select1"></select>
            <input type="number" id="score1" placeholder="0">
        </div>
        <div class="input-group">
            <select id="select2"></select>
            <input type="number" id="score2" placeholder="0">
        </div>
        <div class="input-group">
            <select id="select3"></select>
            <input type="number" id="score3" placeholder="0">
        </div>

        <div id="error-msg" class="error">4 人的總和不等於 0，請檢查數字！</div>
        <button onclick="addRound()">紀錄今局</button>
    </div>

    <!-- 總累積龍虎榜 -->
    <div class="card">
        <h2>🏆 總累積龍虎榜</h2>
        <table>
            <thead>
                <tr>
                    <th>排名</th>
                    <th>玩家</th>
                    <th>總成績</th>
                </tr>
            </thead>
            <tbody id="leaderboard">
                <!-- 動態生成 -->
            </tbody>
        </table>
    </div>

    <!-- 每局歷史紀錄與同步 -->
    <div class="card">
        <h2>📜 所有對局歷史紀錄</h2>
        <div id="history-list"></div>
        
        <button class="btn-share" onclick="exportData()">📤 複製數據傳給雀友同步</button>
        <button class="btn-share" style="background-color:#6c757d;" onclick="importData()">📥 匯入雀友發送的數據</button>
        <button class="btn-clear-all" onclick="clearAllData()">⚠️ 清除所有數據與玩家</button>
    </div>
</div>

<script>
    let players = [];
    let history = []; 

    const Storage = {
        get: function(key) {
            try { return localStorage.getItem(key); } catch (e) { return window['temp_' + key] || null; }
        },
        set: function(key, value) {
            try { localStorage.setItem(key, value); } catch (e) { window['temp_' + key] = value; }
        }
    };

    window.onload = function() {
        loadData();
        updatePlayerSelects();
        renderAll();
    };

    function saveData() {
        Storage.set('mj_v5_players', JSON.stringify(players));
        Storage.set('mj_v5_history', JSON.stringify(history));
    }

    function loadData() {
        const savedPlayers = Storage.get('mj_v5_players');
        const savedHistory = Storage.get('mj_v5_history');
        if (savedPlayers) { try { players = JSON.parse(savedPlayers); } catch(e) { players = []; } }
        if (savedHistory) { try { history = JSON.parse(savedHistory); } catch(e) { history = []; } }
    }

    function addNewPlayer() {
        const input = document.getElementById('new-player-name');
        const name = input.value.trim();
        if (!name) return;
        if (players.includes(name)) { alert('玩家名字已存在！'); return; }
        players.push(name);
        input.value = '';
        saveData();
        updatePlayerSelects();
        renderAll();
    }

    function updatePlayerSelects() {
        for (let i = 0; i < 4; i++) {
            const select = document.getElementById(`select${i}`);
            const currentVal = select.value;
            select.innerHTML = '';
            if (players.length === 0) {
                const opt = document.createElement('option');
                opt.value = ""; opt.innerText = "請先新增玩家";
                select.appendChild(opt);
                continue;
            }
            players.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p; opt.innerText = p;
                select.appendChild(opt);
            });
            if (players.includes(currentVal)) { select.value = currentVal; }
            else if (players[i]) { select.value = players[i]; }
            else { select.value = players[0]; }
        }
    }

    function addRound() {
        if (players.length < 4) { alert('請先新增至少 4 位玩家！'); return; }
        const errorMsg = document.getElementById('error-msg');
        let selectedPlayers = []; let inputs = []; let sum = 0;

        for (let i = 0; i < 4; i++) {
            const pName = document.getElementById(`select${i}`).value;
            const val = parseFloat(document.getElementById(`score${i}`).value) || 0;
            selectedPlayers.push(pName); inputs.push(val); sum += val;
        }

        if (new Set(selectedPlayers).size < 4) { alert('請勿選擇重複玩家！'); return; }
        if (Math.abs(sum) > 0.01) { errorMsg.style.display = 'block'; return; }
        errorMsg.style.display = 'none';

        const now = new Date();
        const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        history.unshift({ players: selectedPlayers, scores: inputs, time: timeStr });

        for (let i = 0; i < 4; i++) { document.getElementById(`score${i}`).value = ''; }
        saveData();
        renderAll();
    }

    function deleteRound(index) {
        if (confirm(`確定要刪除第 ${history.length - index} 局紀錄？`)) {
            history.splice(index, 1);
            saveData();
            renderAll();
        }
    }

    function renderAll() {
        let totals = {};
        players.forEach(p => totals[p] = 0);
        history.forEach(round => {
            round.players.forEach((pName, i) => {
                if (!(pName in totals)) totals[pName] = 0;
                totals[pName] += round.scores[i];
            });
        });

        let leaderboardData = Object.keys(totals).map(name => ({
            name: name, total: totals[name]
        })).sort((a, b) => b.total - a.total);

        const leaderboardTbody = document.getElementById('leaderboard');
        leaderboardTbody.innerHTML = '';

        if (leaderboardData.length === 0) {
            leaderboardTbody.innerHTML = '<tr><td colspan="3" style="color:#999;">暫無玩家數據</td></tr>';
        } else {
            const medals = ['🥇', '🥈', '🥉'];
            leaderboardData.forEach((player, index) => {
                const row = document.createElement('tr');
                // 正數用 win-score (綠色)，負數用 loss-score (紅色)
                const scoreClass = player.total > 0 ? 'win-score' : (player.total < 0 ? 'loss-score' : '');
                const displayScore = player.total > 0 ? `+${player.total}` : player.total;
                row.innerHTML = `
                    <td>${medals[index] || (index + 1)}</td>
                    <td>${player.name}</td>
                    <td class="${scoreClass}">${displayScore}</td>
                `;
                leaderboardTbody.appendChild(row);
            });
        }

        const historyContainer = document.getElementById('history-list');
        historyContainer.innerHTML = '';
        if (history.length === 0) {
            historyContainer.innerHTML = '<p style="text-align:center; color:#999; font-size:0.9em;">暫無對局紀錄</p>';
            return;
        }

        history.forEach((round, index) => {
            const item = document.createElement('div');
            item.className = 'history-item';
            let detailsHtml = '';
            round.players.forEach((pName, pIdx) => {
                const score = round.scores[pIdx];
                const color = score > 0 ? 'var(--win)' : (score < 0 ? 'var(--loss)' : '#666');
                const sign = score > 0 ? '+' : '';
                detailsHtml += `<div>${pName}: <span style="color:${color}; font-weight:bold;">${sign}${score}</span></div>`;
            });
            item.innerHTML = `
                <div style="font-weight:bold; width:65px; color:#666;">第 ${history.length - index} 局<br><span style="font-size:0.8em; font-weight:normal;">${round.time}</span></div>
                <div class="history-details">${detailsHtml}</div>
                <button class="btn-del" onclick="deleteRound(${index})">❌</button>
            `;
            historyContainer.appendChild(item);
        });
    }

    // 數據同步功能
    function exportData() {
        const dataStr = JSON.stringify({ players: players, history: history });
        navigator.clipboard.writeText(dataStr).then(() => {
            alert('對局數據已複製到剪貼簿！你可以直接 Paste / 貼上傳給朋友。');
        }).catch(() => {
            prompt('請複製以下數據發送給雀友：', dataStr);
        });
    }

    function importData() {
        const inputData = prompt('請貼上雀友傳給你的數據代碼：');
        if (!inputData) return;
        try {
            const parsed = JSON.parse(inputData);
            if (parsed.players && parsed.history) {
                players = parsed.players;
                history = parsed.history;
                saveData();
                updatePlayerSelects();
                renderAll();
                alert('數據匯入成功！龍虎榜已更新。');
            } else { alert('數據格式無效！'); }
        } catch (e) { alert('匯入失敗，代碼有誤！'); }
    }

    function clearAllData() {
        if (confirm('⚠️ 確定要清除所有歷史紀錄與玩家名單？')) {
            players = []; history = [];
            saveData(); updatePlayerSelects(); renderAll();
        }
    }
</script>

</body>
</html>
