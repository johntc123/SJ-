<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>即時同步麻雀計錢表 & 龍虎榜</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #2e7d32;
            --text: #333333;
            --win: #2e7d32;
            --loss: #d32f2f;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 500px; }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        h2 { margin-top: 0; color: var(--primary); text-align: center; font-size: 1.2em; }
        .input-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
        .input-group select, .input-group input { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; background-color: #fff; }
        .input-group select { flex: 1; }
        .input-group input { width: 90px; text-align: right; }
        button {
            width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none;
            border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        button:active { opacity: 0.9; }
        .btn-add-player { background-color: #007bff; padding: 8px 12px; width: auto; margin-top: 0; font-size: 14px; white-space: nowrap; }
        .btn-add-row { background-color: #17a2b8; padding: 8px 12px; width: 100%; margin-top: 5px; font-size: 14px; margin-bottom: 10px; }
        .btn-remove-row { background-color: #dc3545; color: white; border: none; padding: 8px 10px; font-size: 14px; border-radius: 6px; cursor: pointer; width: auto; margin-top: 0; }
        .btn-clear-all { background-color: #d32f2f; margin-top: 15px; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.95em; }
        th, td { padding: 10px 5px; text-align: center; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; }
        .win-score { color: var(--win); font-weight: bold; }
        .loss-score { color: var(--loss); font-weight: bold; }
        .error { color: var(--loss); text-align: center; font-size: 0.9em; display: none; margin-top: 5px; }
        .history-item { border-bottom: 1px solid #eee; padding: 10px 0; font-size: 0.85em; display: flex; justify-content: space-between; align-items: center; }
        .history-details { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; flex-grow: 1; }
        .btn-del { background: none; border: none; color: #999; font-size: 1.1em; cursor: pointer; padding: 5px 8px; width: auto; margin: 0; }
        .room-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; background: #e8f5e9; padding: 10px; border-radius: 8px; }
        .fan-section { background: #f8f9fa; padding: 10px; border-radius: 8px; margin-top: 15px; border: 1px dashed #ccc; }
    </style>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

<div class="container">
    <!-- 雲端房間 -->
    <div class="card">
        <h2>🏠 雲端對局房間 v3.0</h2>
        <div class="room-bar">
            <span style="white-space: nowrap; font-weight: bold;">房間號碼：</span>
            <input type="text" id="room-id" value="1" style="flex:1; padding:8px; border:1px solid #ccc; border-radius:6px; font-size:16px;">
            <button class="btn-add-player" onclick="switchRoom()">進入房間</button>
        </div>
        <p style="font-size: 0.8em; color: #666; margin: 0; text-align: center;">只要所有人輸入「同一個房間號碼」，所有手機均可即時同步數據！</p>
    </div>

    <!-- 新增玩家 -->
    <div class="card">
        <h2>👥 新增雀友</h2>
        <div style="display: flex; gap: 8px;">
            <input type="text" id="new-player-name" placeholder="輸入玩家名字" style="flex:1; padding:8px; border:1px solid #ccc; border-radius:6px; font-size:16px;">
            <button class="btn-add-player" onclick="addNewPlayer()">新增</button>
        </div>
    </div>

    <!-- 每局輸贏輸入 -->
    <div class="card">
        <h2>🀄 輸入今局對局</h2>
        <p style="font-size: 0.8em; color: #666; text-align: center; margin-bottom: 10px;">預設 4 人，點擊按鈕可自由擴充人數<br>有填分數者的總和必須等於 0</p>
        
        <div id="dynamic-rows"></div>

        <button type="button" class="btn-add-row" onclick="addPlayerRow()">➕ 增加一位玩家</button>

        <!-- 今局最高食糊紀錄（選填） -->
        <div class="fan-section">
            <div style="font-weight: bold; font-size: 0.9em; margin-bottom: 8px; color: #444;">🀄 今局最高食糊（選填）：</div>
            <div style="display: flex; gap: 8px;">
                <select id="fan-player" style="flex:1; padding:6px; border-radius:6px; font-size:14px;"></select>
                <input type="number" id="fan-count" placeholder="番數/分數" style="width:100px; padding:6px; border:1px solid #ccc; border-radius:6px; font-size:14px;">
            </div>
        </div>

        <div id="error-msg" class="error">參與玩家的總和不等於 0，請檢查數字！</div>
        <button onclick="addRound()">紀錄今局</button>
    </div>

    <!-- 總累積龍虎榜 -->
    <div class="card">
        <h2>🏆 總累積輸贏龍虎榜</h2>
        <table>
            <thead>
                <tr><th>排名</th><th>玩家</th><th>總成績</th></tr>
            </thead>
            <tbody id="leaderboard"></tbody>
        </table>
    </div>

    <!-- 雀友最多出席榜 -->
    <div class="card">
        <h2>📊 雀友最多出席榜</h2>
        <table>
            <thead>
                <tr><th>排名</th><th>玩家</th><th>總出席局數</th></tr>
            </thead>
            <tbody id="attendance-board"></tbody>
        </table>
    </div>

    <!-- 最高食糊番數龍虎榜 -->
    <div class="card">
        <h2>💥 最高食糊番數榜</h2>
        <table>
            <thead>
                <tr><th>排名</th><th>玩家</th><th>最高番數/分數</th></tr>
            </thead>
            <tbody id="maxfan-board"></tbody>
        </table>
    </div>

    <!-- 每局歷史紀錄 -->
    <div class="card">
        <h2>📜 所有對局歷史紀錄</h2>
        <div id="history-list"></div>
        <button class="btn-clear-all" onclick="clearAllData()">⚠️ 清除房間內所有數據與玩家</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDSJbmMGgT8QWWqwHLCSHZClpJL6t-8LQI",
        authDomain: "sjmj-trial-1.firebaseapp.com",
        databaseURL: "https://sjmj-trial-1-default-rtdb.firebaseio.com",
        projectId: "sjmj-trial-1",
        storageBucket: "sjmj-trial-1.firebasestorage.app",
        messagingSenderId: "640071510364",
        appId: "1:640071510364:web:138cce3aef5296f606b999",
        measurementId: "G-RHPREYK24V"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentRoom = "1";
    let players = [];
    let history = [];
    let rowIdCounter = 0;

    window.onload = function() {
        // 預設建立 4 個輸入列
        for(let i=0; i<4; i++) {
            addPlayerRow();
        }
        listenToRoom(currentRoom);
    };

    function addPlayerRow() {
        const container = document.getElementById('dynamic-rows');
        const rowId = `row-${rowIdCounter++}`;
        const div = document.createElement('div');
        div.className = 'input-group';
        div.id = rowId;
        div.innerHTML = `
            <select class="row-select"></select>
            <input type="number" class="row-score" placeholder="0">
            <button type="button" class="btn-remove-row" onclick="removePlayerRow('${rowId}')">✕</button>
        `;
        container.appendChild(div);
        updatePlayerSelects();
    }

    function removePlayerRow(rowId) {
        const container = document.getElementById('dynamic-rows');
        if (container.children.length <= 2) {
            alert('最少需要保留 2 位玩家輸入列！');
            return;
        }
        const elem = document.getElementById(rowId);
        if (elem) elem.remove();
    }

    function switchRoom() {
        const roomInput = document.getElementById('room-id').value.trim();
        if (!roomInput) return;
        currentRoom = roomInput;
        listenToRoom(currentRoom);
    }

    function listenToRoom(roomId) {
        db.ref('rooms/' + roomId).on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                players = data.players || [];
                history = data.history || [];
            } else {
                players = []; history = [];
            }
            updatePlayerSelects();
            renderAll();
        });
    }

    function pushDataToCloud() {
        db.ref('rooms/' + currentRoom).set({
            players: players,
            history: history
        });
    }

    function addNewPlayer() {
        const input = document.getElementById('new-player-name');
        const name = input.value.trim();
        if (!name) return;
        if (players.includes(name)) { alert('玩家名字已存在！'); return; }
        players.push(name);
        input.value = '';
        pushDataToCloud();
    }

    function updatePlayerSelects() {
        const selects = document.querySelectorAll('.row-select');
        const fanSelect = document.getElementById('fan-player');
        const currentFanVal = fanSelect ? fanSelect.value : '';
        if (fanSelect) fanSelect.innerHTML = '<option value="">無 / 未有紀錄</option>';

        selects.forEach((select, idx) => {
            const currentVal = select.value;
            select.innerHTML = '<option value="">-- 不參與 / 無 --</option>';

            players.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p; opt.innerText = p;
                select.appendChild(opt);
            });

            if (players.includes(currentVal)) {
                select.value = currentVal;
            } else if (players[idx]) {
                select.value = players[idx];
            } else {
                select.value = "";
            }
        });

        if (fanSelect) {
            players.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p; opt.innerText = p;
                fanSelect.appendChild(opt);
            });
            if (players.includes(currentFanVal)) fanSelect.value = currentFanVal;
        }
    }

    function addRound() {
        const errorMsg = document.getElementById('error-msg');
        const selects = document.querySelectorAll('.row-select');
        const scoreInputs = document.querySelectorAll('.row-score');

        let selectedPlayers = [];
        let inputs = [];
        let sum = 0;

        for (let i = 0; i < selects.length; i++) {
            const pName = selects[i].value;
            const valStr = scoreInputs[i].value.trim();

            if (pName !== "" && valStr !== "") {
                const val = parseFloat(valStr) || 0;
                selectedPlayers.push(pName);
                inputs.push(val);
                sum += val;
            }
        }

        if (selectedPlayers.length < 2) {
            alert('請至少選擇 2 位參與此局的玩家並填寫分數！');
            return;
        }

        if (new Set(selectedPlayers).size < selectedPlayers.length) {
            alert('同一局內請勿選擇重複的玩家！');
            return;
        }

        if (Math.abs(sum) > 0.01) {
            errorMsg.style.display = 'block';
            return;
        }
        errorMsg.style.display = 'none';

        const fanPlayer = document.getElementById('fan-player').value;
        const fanCount = parseFloat(document.getElementById('fan-count').value) || 0;

        const now = new Date();
        const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        
        history.unshift({
            players: selectedPlayers,
            scores: inputs,
            time: timeStr,
            fanPlayer: fanPlayer,
            fanCount: fanCount
        });

        scoreInputs.forEach(input => input.value = '');
        document.getElementById('fan-count').value = '';
        pushDataToCloud();
    }

    function deleteRound(index) {
        if (confirm(`確定要刪除第 ${history.length - index} 局紀錄？`)) {
            history.splice(index, 1);
            pushDataToCloud();
        }
    }

    function renderAll() {
        const medals = ['🥇', '🥈', '🥉'];

        let totals = {};
        let attendance = {};
        let maxFans = {};

        players.forEach(p => {
            totals[p] = 0;
            attendance[p] = 0;
            maxFans[p] = 0;
        });

        history.forEach(round => {
            round.players.forEach((pName, i) => {
                if (!(pName in totals)) totals[pName] = 0;
                if (!(pName in attendance)) attendance[pName] = 0;
                totals[pName] += round.scores[i];
                attendance[pName] += 1;
            });

            if (round.fanPlayer && round.fanCount > 0) {
                if (!(round.fanPlayer in maxFans) || round.fanCount > maxFans[round.fanPlayer]) {
                    maxFans[round.fanPlayer] = round.fanCount;
                }
            }
        });

        // 1. 總輸贏龍虎榜
        let leaderboardData = Object.keys(totals).map(name => ({ name: name, total: totals[name] })).sort((a, b) => b.total - a.total);
        const leaderboardTbody = document.getElementById('leaderboard');
        leaderboardTbody.innerHTML = leaderboardData.length === 0 ? '<tr><td colspan="3" style="color:#999;">暫無數據</td></tr>' : '';
        leaderboardData.forEach((p, i) => {
            const scoreClass = p.total > 0 ? 'win-score' : (p.total < 0 ? 'loss-score' : '');
            const displayScore = p.total > 0 ? `+${p.total}` : p.total;
            leaderboardTbody.innerHTML += `<tr><td>${medals[i] || (i + 1)}</td><td>${p.name}</td><td class="${scoreClass}">${displayScore}</td></tr>`;
        });

        // 2. 出席率榜
        let attendanceData = Object.keys(attendance).map(name => ({ name: name, count: attendance[name] })).sort((a, b) => b.count - a.count);
        const attendanceTbody = document.getElementById('attendance-board');
        attendanceTbody.innerHTML = attendanceData.length === 0 ? '<tr><td colspan="3" style="color:#999;">暫無數據</td></tr>' : '';
        attendanceData.forEach((p, i) => {
            attendanceTbody.innerHTML += `<tr><td>${medals[i] || (i + 1)}</td><td>${p.name}</td><td><b>${p.count}</b> 局</td></tr>`;
        });

        // 3. 最高番數榜
        let maxFanData = Object.keys(maxFans).filter(name => maxFans[name] > 0).map(name => ({ name: name, fan: maxFans[name] })).sort((a, b) => b.fan - a.fan);
        const maxfanTbody = document.getElementById('maxfan-board');
        maxfanTbody.innerHTML = maxFanData.length === 0 ? '<tr><td colspan="3" style="color:#999;">暫無食糊紀錄</td></tr>' : '';
        maxFanData.forEach((p, i) => {
            maxfanTbody.innerHTML += `<tr><td>${medals[i] || (i + 1)}</td><td>${p.name}</td><td style="color:var(--primary); font-weight:bold;">${p.fan} 番/分</td></tr>`;
        });

        // 4. 歷史紀錄
        const historyContainer = document.getElementById('history-list');
        historyContainer.innerHTML = history.length === 0 ? '<p style="text-align:center; color:#999; font-size:0.9em;">暫無對局紀錄</p>' : '';
        history.forEach((round, index) => {
            const item = document.createElement('div');
            item.className = 'history-item';
            let detailsHtml = '';
            round.players.forEach((pName, pIdx) => {
                const score = round.scores[pIdx];
                const color = score > 0 ? 'var(--win)' : (score < 0 ? 'var(--loss)' : '#666');
                const sign = score > 0 ? '+' : '';
                detailsHtml += `<div>${pName}: <span style="color:${color}; font-weight:bold;">${sign}${score}</span></div>`;
            });
            
            let fanInfo = round.fanPlayer && round.fanCount > 0 ? `<div style="grid-column: span 2; color:#007bff; font-weight:bold;">🀄 ${round.fanPlayer} 食 ${round.fanCount} 番</div>` : '';

            item.innerHTML = `
                <div style="font-weight:bold; width:65px; color:#666;">第 ${history.length - index} 局<br><span style="font-size:0.8em; font-weight:normal;">${round.time}</span></div>
                <div class="history-details">${detailsHtml}${fanInfo}</div>
                <button class="btn-del" onclick="deleteRound(${index})">❌</button>
            `;
            historyContainer.appendChild(item);
        });
    }

    function clearAllData() {
        if (confirm('⚠️ 確定要清除房間內所有歷史紀錄與玩家名單？')) {
            players = []; history = [];
            pushDataToCloud();
        }
    }
</script>

</body>
</html>
